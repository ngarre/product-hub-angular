<form 
[formGroup]="formularioProducto"
(ngSubmit)="agregarProducto()">
<label for="campo-nombre">Nombre:</label> <!-- "campo-nombre" is HTML and says to label: this text belongs to the element whose id is "campo-nombre"-->
<input
    id="campo-nombre"
    type="text"
    formControlName="nombre">


<label for="campo-precio">Precio:</label>
<input
    id="campo-precio"
    type="number"
    formControlName="precio">
<button type="submit">Añadir producto</button>
</form>

<p>Nombre: {{ formularioProducto.value.nombre }}</p>
<p>Precio: {{ formularioProducto.value.precio }}</p>
